name: CI

# El deploy lo hace Netlify al detectar un push en main. Este workflow no
# publica nada: verifica que lo que entra a main compile, tipe bien y no rompa
# ninguna de las auditorías de `scripts/` — layout móvil, cotizador y enlaces.
#
# Antes estas tres solo se corrían a mano ("cuando alguien se acordaba"). Con
# varias personas tocando el mismo sitio, acordarse no basta: por eso corren
# aquí, en cada PR, contra el `dist/` recién construido.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Tipos, build y auditorías
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # `astro build` NO comprueba tipos. Sin este paso, un error de TypeScript
      # llega a producción con el CI en verde.
      - name: Comprobar tipos
        run: npm run check

      - name: Build
        run: npm run build

      # El simulacro de Cloudflare: construye lo que Cloudflare publicaría y valida
      # el Worker y su configuración, sin credenciales. Una regla de cabeceras rota
      # o un Worker que no compila se enteran aquí, no el día del cambio.
      - name: Cloudflare (simulacro de despliegue)
        run: |
          node scripts/cloudflare-assets.mjs
          npx --yes wrangler@4.158.0 deploy --dry-run

      - name: Enlaces internos rotos
        run: npm run medir:enlaces

      # Playwright NO es dependencia del proyecto a propósito (ver README y
      # docs/convenciones.md): se instala aquí, solo para este job, sin tocar
      # package.json ni el build de Netlify.
      - name: Instalar Playwright (solo para este job)
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Layout móvil
        run: npm run medir:movil

      - name: Cotizador
        run: npm run medir:cotizador

      # El chat en teléfono y escritorio: que no se salga de la pantalla, que
      # el campo mida 16 px (si no, Safari de iPhone amplía la página), que el
      # teclado no se abra solo, que se pueda mover, y que cada botón de la guía
      # lleve a una página y una sección que existan.
      - name: Chat
        run: npm run medir:chat

      - name: Privacidad del chat
        run: npm run medir:privacidad

      - name: Galería de proyectos
        run: npm run medir:galeria
