# Configuración Netlify para PanaClaw (Astro)

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

  # Netlify da por secreta TODA variable de entorno y falla el build si encuentra
  # su valor en un archivo del repo. Con CHAT_PROVIDER eso es un falso positivo
  # garantizado: su valor es literalmente la palabra `groq` o `anthropic`, que
  # aparece en el README y en docs/chat.md porque documentarla es justamente el
  # punto — se puso ahí para que nadie tenga que adivinar a qué proveedor se está
  # llamando.
  #
  # Se excluye SOLO esa clave, no las rutas. Excluir README.md y docs/chat.md
  # dejaría de vigilarlos para todo lo demás, incluida GROQ_API_KEY, que sí es un
  # secreto de verdad y tiene que seguir saltando si alguien la pega en un
  # archivo.
  SECRETS_SCAN_OMIT_KEYS = "CHAT_PROVIDER"

# ---------- FUNCIONES ----------
# El chat vive en netlify/functions/chat.mts y se publica en /api/chat (la ruta
# se declara con `export const config` dentro de la propia función).
#
# Variables de entorno a configurar en el panel de Netlify — NUNCA en el repo:
#   ANTHROPIC_API_KEY  clave de Claude (si está, tiene prioridad)
#   GROQ_API_KEY       clave de Groq (alternativa más barata)
#   CHAT_PROVIDER      opcional, 'groq' o 'anthropic' para fijar cuál se usa
#   CHAT_MODEL         opcional, para fijar el modelo (varios, separados por comas)
#   CHAT_MAX_PER_DAY   opcional, techo diario de mensajes (300 por defecto)
#
# Sin ninguna clave el endpoint sigue respondiendo: deriva a WhatsApp en vez de
# fallar. Las claves solo existen en el servidor; el navegador nunca las ve.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ---------- HEADERS ----------
# Por defecto: cabeceras de seguridad y NADA de caché agresiva, para que un
# despliegue se vea al instante.
#
# El `Cache-Control` vivía en una regla `for = "/*.html"`. Al pasar a URLs de
# directorio esa regla dejó de servir: la página ya no se pide como
# `/contacto.html` sino como `/contacto/`, así que solo habría seguido
# acertando en `/404.html` y todas las demás se habrían quedado sin política.
# Por eso ahora el valor por defecto cuelga de `/*` y la excepción se declara
# aparte, abajo.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cache-Control = "public, max-age=0, must-revalidate"

# La excepción: los assets de Astro llevan un hash en el nombre, así que un
# archivo concreto no cambia nunca — si cambia el contenido, cambia el nombre.
# Esta regla va DESPUÉS y es MÁS ESPECÍFICA que la de arriba, que son los dos
# criterios con los que Netlify puede resolver un conflicto: gane el que gane,
# el año de caché inmutable se conserva.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Assets sueltos de public/ (favicons, og image, iconos PWA). No llevan hash en
# el nombre, así que no pueden ser `immutable`, pero sí un mes de caché — cambian
# raras veces y cuando lo hacen se puede forzar recarga con Ctrl+Shift+R o
# esperar 30 días. PageSpeed marcaba estos assets como "tiempos de vida de caché
# poco eficientes" (~205 KiB de ahorro estimado) porque heredaban el default de
# `max-age=0, must-revalidate`. Los pongo por extensión, uno por regla, porque
# Netlify no soporta patrones con llaves.
[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
